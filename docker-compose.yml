services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: race_db
      POSTGRES_USER: race
      POSTGRES_PASSWORD: race
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  competition-service:
    image: racing-service
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8080:8080"
    volumes:
      - racing_data:/var/lib/racing/data

volumes:
  pgdata:
  racing_data: